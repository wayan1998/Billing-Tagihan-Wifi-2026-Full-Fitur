.iv h2{margin:0}.iv table{min-width:0}.iv .tt{font-size:18px;font-weight:800}.stamp{color:var(--ok);border:3px solid var(--ok);display:inline-block;padding:2px 12px;font-weight:800;transform:rotate(-6deg);margin:8px 0}

.sc{background:none;border:0;overflow:visible}.sc table,.sc tbody,.sc tr,.sc td{display:block;min-width:0;width:100%}.sc th{display:none}.sc tr:has(th){display:none}.sc tr{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;margin-bottom:10px;box-shadow:0 1px 4px #0000000d}.sc td{border:0;padding:3px 0}.sc td.ac{white-space:normal;padding-top:8px}.sc td.ac .b{padding:9px 13px;font-size:13px}
.mb{align-items:flex-end;padding:0}.m{border-radius:22px 22px 0 0;max-width:none}.tb input,.tb select{flex:1;min-width:120px}}

body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 500px at 85% -10%,#0b8fb02e,transparent),var(--bg)}
header{backdrop-filter:blur(10px);box-shadow:0 6px 24px #0b8fb033}
nav button.on{background:linear-gradient(135deg,#0b8fb0,#16c2d9);color:#fff;box-shadow:0 4px 12px #0b8fb066}
.b{background:linear-gradient(135deg,#0b8fb0,#13b5d3);box-shadow:0 4px 12px #0b8fb044;transition:transform .15s}.b:active{transform:scale(.96)}.b.g2{background:var(--pl);box-shadow:none}.b.r{background:var(--bad)}
.hero{grid-column:1/-1;background:linear-gradient(135deg,#0a2a44,#0b8fb0 60%,#16c2d9);color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 12px 30px #0b8fb044}.hero small{opacity:.85;display:block}.hero b{font-size:30px;display:block}.pg{height:8px;border-radius:9px;background:#fff3;margin:10px 0 6px;overflow:hidden}.pg i{display:block;height:100%;background:#fff;border-radius:9px}
.k{position:relative;overflow:hidden;padding-left:18px}.k::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--pr)}.g .k:nth-child(4)::before{background:var(--ok)}.g .k:nth-child(5)::before{background:var(--wr)}.g .k:nth-child(6)::before{background:var(--bad)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0b8fb0,#16c2d9);color:#fff;font-weight:800;font-size:13px;margin-right:8px;vertical-align:middle}
.m{animation:up .25s ease}@keyframes up{from{transform:translateY(30px);opacity:0}}
.wf{width:64px;height:64px;margin:0 auto 10px;position:relative}.wf i{position:absolute;inset:0;border:3px solid var(--pr);border-radius:50%;opacity:0;animation:rg 2.4s infinite}.wf i:nth-child(2){animation-delay:.8s}.wf i:nth-child(3){animation-delay:1.6s}@keyframes rg{from{transform:scale(.2);opacity:.9}to{transform:scale(1);opacity:0}}
.lg{background:radial-gradient(600px 400px at 50% 0,#0b8fb044,transparent)}
.g .k.o::before{background:var(--ok)}.g .k.w::before{background:var(--wr)}.g .k.d::before{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
const $=s=>document.querySelector(s),K='dwinet_tagihan_v1',BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp'+Math.round(+n||0).toLocaleString('id-ID'),td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},uid=()=>Math.random().toString(36).slice(2,9);
const per=p=>{const a=p.split('-');return BL[a[1]-1]+' '+a[0]},fd=d=>d?d.split('-').reverse().join('/'):'-';
const defU=()=>[{id:'u1',n:'Administrator',u:'admin',p:(S&&S.cfg&&S.cfg.pin)||'admin123',r:'admin'},{id:'u2',n:'Penagih 1',u:'penagih1',p:'1234',r:'penagih'}];
const seed=()=>({seq:0,users:defU(),cfg:{nama:'DWINET.ID',alamat:'',wa:'',rek:'Transfer: BCA 0000000000 a.n. DWINET.ID',denda:2000,maxd:30,pin:'admin123',tpl:'Yth. {nama}, tagihan WiFi DWINET.ID periode {periode} sebesar {total} jatuh tempo {tempo}. {rek}. Terima kasih.'},
pkg:[{id:'p1',n:'Hemat 10 Mbps',h:150000},{id:'p2',n:'Keluarga 20 Mbps',h:200000},{id:'p3',n:'Gamer 50 Mbps',h:350000}],
cus:[{id:'c1',kode:'DW-0001',n:'Budi Santoso',hp:'081234567890',al:'Jl. Merdeka No. 1',pk:'p2',st:'aktif',tg:5,user:'budi@dwinet',reg:'2026-01-10'},{id:'c2',kode:'DW-0002',n:'Siti Aminah',hp:'082198765432',al:'Jl. Mawar No. 7',pk:'p1',st:'aktif',tg:10,user:'siti@dwinet',reg:'2026-02-03'}],inv:[],exp:[]});
let S={cfg:{nama:'DWINET.ID',alamat:'',wa:'',rek:'',denda:2000,maxd:30,pw:58,tpl:''},pkg:[],cus:[],inv:[],exp:[],users:[],seq:0};
const TB=['pkg','cus','inv','exp','users'];let SNAP={},busy=Promise.resolve();
function snap(){SNAP={cfg:JSON.stringify(S.cfg),seq:S.seq||0};TB.forEach(t=>{SNAP[t]={};(S[t]||[]).forEach(r=>SNAP[t][r.id]=JSON.stringify(r))})}
async function api(a,b){const r=await fetch('api.php?a='+a,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(d.err||'Gagal terhubung ke server'),{st:r.status});return d}
function save(){const up={},del={};let n=0;TB.forEach(t=>{up[t]=[];del[t]=[];const ids={};(S[t]||[]).forEach(r=>{ids[r.id]=1;if(SNAP[t][r.id]!==JSON.stringify(r))up[t].push(r)});Object.keys(SNAP[t]).forEach(id=>{if(!ids[id])del[t].push(id)});n+=up[t].length+del[t].length});
const cf=JSON.stringify(S.cfg)!==SNAP.cfg;if(!n&&!cf&&(S.seq||0)===SNAP.seq)return;
const p=JSON.parse(JSON.stringify({up,del,cfg:cf?S.cfg:null,seq:S.seq||0}));S.users.forEach(u=>u.p='');snap();busy=busy.then(()=>api('sync',p)).catch(e=>{toast(e.message);load()})}
async function load(q){try{const d=await api('all'),j=JSON.stringify(d);if(q&&j===load.j)return;load.j=j;Object.assign(S,d);V.u=d.u;V.me=d.u.id;snap();if(!(q&&$('#md').innerHTML))render()}catch(e){if(V.u===undefined||e.st===401){V.u=null;render();if(e.st!==401)toast(e.message)}else if(!q)toast(e.message)}}
const V={tab:'dash',bm:td().slice(0,7),f:'all',q:'',u:undefined};
const me=()=>V.u,adm=()=>{const u=me();return !!u&&u.r==='admin'};
const gc=i=>S.cus.find(c=>c.id===i)||{n:'(dihapus)',hp:'',kode:'-'},gp=i=>S.pkg.find(p=>p.id===i)||{n:'-',h:0};
const dend=i=>{if(i.st==='lunas')return i.dn||0;const d=Math.floor((new Date(td())-new Date(i.jt))/864e5);return d>0?Math.min(d,S.cfg.maxd)*S.cfg.denda:0};
const tot=i=>i.b-(i.ds||0)+dend(i),sum=a=>a.reduce((s,i)=>s+tot(i),0);
const over=i=>i.st!=='lunas'&&dend(i)>0;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function modal(h){$('#md').innerHTML='<div class="mb" onclick="if(event.target===this)cm()"><div class="m">'+h+'</div></div>'}
const cm=()=>$('#md').innerHTML='';
function ask(msg,fn){window._f=fn;modal('<p>'+msg+'</p><div class="tb"><button class="b r" onclick="cm();_f()">Ya, lanjutkan</button><button class="b g2" onclick="cm()">Batal</button></div>')}
const fld=(l,i,v,t)=>`<label class="f">${l}<input id="${i}" type="${t||'text'}" value="${E(v)}"></label>`;
const sel=(l,i,o,v)=>`<label class="f">${l}<select id="${i}">${o.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>${E(x[1])}</option>`).join('')}</select></label>`;
const val=i=>$('#'+i).value.trim();
const wa=(hp,msg)=>{let n=String(hp).replace(/\D/g,'');if(n[0]==='0')n='62'+n.slice(1);return 'https://wa.me/'+n+'?text='+encodeURIComponent(msg)};
const msgOf=i=>S.cfg.tpl.replace('{nama}',gc(i.cid).n).replace('{periode}',per(i.per)).replace('{total}',rp(tot(i))).replace('{tempo}',fd(i.jt)).replace('{rek}',S.cfg.rek);
const badge=i=>i.st==='lunas'?'<span class="bg ok">Lunas</span>':over(i)?'<span class="bg bad">Menunggak</span>':'<span class="bg wr">Belum bayar</span>';
const T=[['dash','Beranda','🏠',1],['bill','Tagihan','🧾',1],['cus','Pelanggan','👥',1],['pkg','Paket','📦',0],['rep','Laporan','📊',0],['set','Atur','⚙️',0]];
function go(t){V.tab=t;V.q='';V.f='all';render()}
function th(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
function render(){
if(V.u===undefined){$('#root').innerHTML='<div class="lg"><p class="mu">Memuat...</p></div>';return}if(!me()){$('#root').innerHTML=`<div class="lg"><div class="c"><div class="wf"><i></i><i></i><i></i></div><div class="logo" style="color:var(--tx)">DWINET<i>.ID</i></div><p class="mu">Masuk untuk mengelola tagihan WiFi</p><input id="lu" placeholder="Username" autocapitalize="none" style="width:100%;margin-bottom:8px"><input id="lp" type="password" placeholder="Password" style="width:100%;margin-bottom:10px" onkeydown="if(event.key==='Enter')login()"><button class="b" style="width:100%" onclick="login()">Masuk</button><p class="mu" style="font-size:12px">Pertama kali dipakai? Isi username dan password baru untuk membuat akun admin.</p></div></div>`;return}
if(!adm()&&!(T.find(t=>t[0]===V.tab)||[])[3])V.tab='bill';const f={dash:adm()?vDash:vHome,bill:vBill,cus:vCus,pkg:vPkg,rep:vRep,set:vSet}[V.tab];
$('#root').innerHTML=`<header><div class="logo">${E(S.cfg.nama.replace('.ID',''))}<i>${S.cfg.nama.includes('.ID')?'.ID':''}</i></div><span class="sp"></span><span class="who">${E(me().n)} · ${me().r}</span><button class="b s g2" onclick="th()">Tema</button><button class="b s g2" onclick="logout()">Keluar</button></header><nav>${T.filter(t=>adm()||t[3]).map(t=>`<button class="${V.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[2]}</b>${t[1]}</button>`).join('')}</nav><main>${f()}</main>`}
async function login(){try{await api('login',{u:val('lu'),p:$('#lp').value});await load();V.tab='dash';render()}catch(e){toast(e.message)}}
async function logout(){try{await api('logout',{})}catch(e){}V.u=null;S.cus=[];S.inv=[];S.exp=[];S.users=[];render()}
const mSel=()=>`<input type="month" value="${V.bm}" onchange="V.bm=this.value||V.bm;render()">`;
function vDash(){
const mi=S.inv.filter(i=>i.per===V.bm),lu=mi.filter(i=>i.st==='lunas'),bl=mi.filter(i=>i.st!=='lunas'),ov=S.inv.filter(over);
let bars='',d=new Date();for(let k=5;k>=0;k--){const x=new Date(d.getFullYear(),d.getMonth()-k,1),key=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),r=sum(S.inv.filter(i=>i.st==='lunas'&&(i.pd||'').slice(0,7)===key));bars+=`<div data-v="${r}"><i style="height:BARH${r}px"></i>${BL[x.getMonth()].slice(0,3)}</div>`}
const mx=Math.max(1,...[...bars.matchAll(/data-v="(\d+)"/g)].map(m=>+m[1]));bars=bars.replace(/BARH(\d+)/g,(m,v)=>Math.max(2,Math.round(+v/mx*110)));
return `<div class="tb"><h2 style="margin:0">Ringkasan</h2><span class="sp" style="flex:1"></span>${mSel()}</div>
<div class="g"><div class="hero"><small>Terkumpul ${per(V.bm)}</small><b>${rp(sum(lu))}</b><div class="pg"><i style="width:${mi.length?Math.round(sum(lu)/Math.max(1,sum(mi))*100):0}%"></i></div><span>${mi.length?Math.round(sum(lu)/Math.max(1,sum(mi))*100):0}% dari ${rp(sum(mi))}</span></div><div class="c k"><small>Pelanggan aktif</small><b>${S.cus.filter(c=>c.st==='aktif').length}</b><em> dari ${S.cus.length} pelanggan</em></div>
<div class="c k"><small>Tagihan ${per(V.bm)}</small><b>${rp(sum(mi))}</b><em> ${mi.length} tagihan</em></div>
<div class="c k"><small>Sudah dibayar</small><b style="color:var(--ok)">${rp(sum(lu))}</b><em> ${lu.length} lunas</em></div>
<div class="c k"><small>Belum dibayar</small><b style="color:var(--wr)">${rp(sum(bl))}</b><em> ${bl.length} tagihan</em></div>
<div class="c k"><small>Total tunggakan</small><b style="color:var(--bad)">${rp(sum(ov))}</b><em> ${ov.length} lewat tempo</em></div></div>
<div class="c"><b>Pendapatan 6 bulan terakhir</b><div class="bar">${bars}</div></div>

function shR(t){

${mt.length?`<h3>Setoran hari ini per metode</h3><div class="sc"><table>${mt.map(x=>`<tr><td>${x[0]}</td><td><b>${rp(x[1])}</b></td></tr>`).join('')}</table></div>`:''}
<h3>Transaksi hari ini</h3>${hr.length?`<div class="sc"><table>${hr.map(i=>`<tr><td>${av(i)}<br><small class="mu">${per(i.per)} · ${E(i.pm)}</small></td><td><b>${rp(tot(i))}</b></td><td class="ac"><button class="b s g2" onclick="strk('${i.id}')">Struk</button><button class="b s r" onclick="batalF('${i.id}')">Batal bayar</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Belum ada pembayaran hari ini.</p>'}
